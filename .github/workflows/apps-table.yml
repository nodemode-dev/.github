name: Apps table

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "profile/README.md"
      - ".github/workflows/apps-table.yml"

permissions:
  contents: read

concurrency:
  group: apps-table
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - run: python -m pytest -q tests
